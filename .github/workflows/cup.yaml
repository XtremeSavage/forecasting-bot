name: Main bot on Metaculus Cup

on:
  schedule:
    - cron: "0 2 */2 * *"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --no-interaction --no-root
      - name: Run bot
        id: run
        continue-on-error: true
        run: |
          set +e
          poetry run python run.py --mode cup --limit 15
          echo "exit=$?" >> "$GITHUB_OUTPUT"
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      - name: Commit run records
        run: |
          git config user.name "forecasting-bot"
          git config user.email "bot@users.noreply.github.com"
          git add runs/
          if git diff --cached --quiet; then echo "no records"; exit 0; fi
          git commit -m "runs: $(date -u +%Y-%m-%dT%H:%MZ) mode=cup"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail job if guards fired
        if: steps.run.outputs.exit != '0'
        run: echo "bot exited with ${{ steps.run.outputs.exit }} (guards fired or error)"; exit 1
