name: Deploy dashboard to Pages

on:
  push:
    branches: [main]
    paths:
      - "runs/**"
      - "docs/dashboard/**"
  # A push made by a workflow with GITHUB_TOKEN never triggers other workflows, so the
  # bot runs' record commits do not fire the push trigger above (seen 2026-09-14).
  # Rebuild after every bot workflow completes instead, with a daily backstop.
  workflow_run:
    workflows: ["Main bot on tournament", "Main bot on Metaculus Cup", "Test bot"]
    types: [completed]
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build dashboard data
        run: python docs/dashboard/build_index.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dashboard

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
