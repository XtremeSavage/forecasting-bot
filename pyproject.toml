[tool.poetry]
name = "forecasting-bot"
version = "0.1.0"
description = "Metaculus FutureEval bot with intelligence-tradecraft stages"
authors = ["XtremeSavageXD"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
forecasting-tools = "0.3.1"
openai = "^2.0.0"
anthropic = "^1.5.0"
httpx = "^0.28.1"
trafilatura = "^2.2.0"
pydantic = "^2.7"
pyyaml = "^6.0.3"
python-dotenv = "^1.0.1"
numpy = "^2.3.0"
asknews = "^0.13.11"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # Third-party: asknews_sdk (pulled in transitively by forecasting_tools) still uses
    # pydantic's class-based `Config`, which is deprecated in pydantic v2. Nothing in
    # this repo triggers it and we can't fix the dependency's source, so it's silenced
    # narrowly (by exact module) rather than masking warnings from our own code.
    "ignore:Support for class-based `config` is deprecated:pydantic.warnings.PydanticDeprecatedSince20:asknews_sdk.dto.common",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
